# Local development stack. Run: docker compose up -d
# API: http://localhost:8000  ·  SPA: http://localhost:5173  ·  MinIO console: http://localhost:9001

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vet_clinic
      POSTGRES_USER: vet
      POSTGRES_PASSWORD: vet
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vet -d vet_clinic"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build:
      context: ./api
      target: base
    working_dir: /var/www/api
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      PHP_OPCACHE_VALIDATE: "1"
    volumes: ["./api:/var/www/api"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  queue:
    build:
      context: ./api
      target: base
    working_dir: /var/www/api
    command: php artisan queue:work --tries=3 --backoff=10
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes: ["./api:/var/www/api"]
    depends_on: [api]

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes: ["./web:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
